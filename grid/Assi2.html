<!DOCTYPE html>
<html>
<head>
    <title>Grid Layout with Named Areas</title>
    <style>
        .container {
            display: grid;
            grid-template-areas:
                "header header"
                "sidebar main"
                "footer footer";
            
            grid-template-columns: 1fr 3fr;  /* Sidebar : Main */
            grid-template-rows: 1fr 4fr 1fr; /* Header, Content, Footer */
            height: 100vh;
            gap: 10px;
        }

        .header {
            grid-area: header;
            background-color: lightblue;
        }

        .sidebar {
            grid-area: sidebar;
            background-color: lightgreen;
        }

        .main {
            grid-area: main;
            background-color: lightcoral;
        }

        .footer {
            grid-area: footer;
            background-color: lightgray;
        }

        .container > div {
            padding: 20px;
            font-size: 20px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">Header</div>
        <div class="sidebar">Sidebar</div>
        <div class="main">Main Content</div>
        <div class="footer">Footer</div>
    </div>

</body>
</html>
