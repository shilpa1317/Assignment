<!DOCTYPE html>
<html>
<head>
    <title>Responsive Gallery</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            padding: 20px;
        }

        .gallery img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <div class="gallery">
        <img src="../1.jpg" alt="">
        <img src="../2.jpg" alt="">
        <img src="../3.jpg" alt="">
        <img src="../4.jpg" alt="">
        <img src="../5.jpg" alt="">
        <img src="../6.jpg" alt="">
        <img src="../7.jpg" alt="">
        <img src="../8.jpg" alt="">
    </div>

</body>
</html>
